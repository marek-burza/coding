[build-system]
requires = [ "uv_build>=0.11.28,<0.12" ]
build-backend = "uv_build"

[project]
name = "banking"
description = "Banking API"
version = "0.0.0"
authors = [
    { name = "noreply", email = "noreply@localhost" }
]
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
classifiers = [
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.139.2,<0.140",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.4,<3",
    "sqlalchemy>=2.0.32,<3",
    "uvicorn[standard]>=0.51.0,<0.52",
]

[dependency-groups]
dev = [
    "bandit>=1.9.2,<2",
    "complexipy>=5.0.0,<6",
    "coverage>=7.13.0,<8",
    "deptry>=0.24.0,<0.25",
    "httpx2>=2.0,<3",
    "mypy>=1.19.0,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.0,<0.16",
]

[tool.coverage.run]
source = [ "src" ]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.deptry]
known_first_party = [ "banking" ]

[tool.deptry.per_rule_ignores]
DEP002 = [ "alembic", "psycopg", "uvicorn" ]

[tool.ruff.lint.isort]
known-first-party = [ "banking", "conftest" ]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "src", "tests" ]
